services:
  - type: web
    name: docflow-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    envVars:
      - key: FRONTEND_URL
        value: https://docflow-liard.vercel.app
      - key: DOCFLOW_TESSERACT_COMMAND
        value: tesseract
      - key: DOCFLOW_OCR_PROVIDER
        value: google_vision
      - key: DOCFLOW_GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
