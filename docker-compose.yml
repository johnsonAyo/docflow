services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - docflow-mongodb:/data/db

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - docflow-minio:/data

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      DOCFLOW_MONGODB_URI: ${DOCFLOW_MONGODB_URI}
      DOCFLOW_MONGODB_DATABASE: ${DOCFLOW_MONGODB_DATABASE:-docflow}
      DOCFLOW_S3_ENDPOINT_URL: ${DOCFLOW_S3_ENDPOINT_URL}
      DOCFLOW_S3_ACCESS_KEY_ID: ${DOCFLOW_S3_ACCESS_KEY_ID}
      DOCFLOW_S3_SECRET_ACCESS_KEY: ${DOCFLOW_S3_SECRET_ACCESS_KEY}
      DOCFLOW_S3_REGION: ${DOCFLOW_S3_REGION:-us-east-1}
      DOCFLOW_DOCUMENT_BUCKET: ${DOCFLOW_DOCUMENT_BUCKET:-docflow-documents}
      DOCFLOW_OCR_PROVIDER: ${DOCFLOW_OCR_PROVIDER:-google_vision}
      DOCFLOW_GOOGLE_APPLICATION_CREDENTIALS_JSON: ${DOCFLOW_GOOGLE_APPLICATION_CREDENTIALS_JSON:-}
      DOCFLOW_TESSERACT_COMMAND: tesseract
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - minio

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - docflow-web-node-modules:/app/node_modules

volumes:
  docflow-mongodb:
  docflow-minio:
  docflow-web-node-modules:
